<script>
(()=>{
const lessons=[
 {name:'最初の表示',tag:'はじめの一歩',title:'Javaで、はじめまして。',intro:'Javaのプログラムを動かしてみよう。まずは画面に挨拶を表示します。',concept:'Javaのプログラムはクラスの中に書きます。<code>main</code> メソッドが実行の入口で、<code>System.out.println</code> が文字を表示します。',detail:'Javaはクラスを基本単位にする言語です。ファイル名Main.javaに合わせて、public class Main と書きます。プログラムは public static void main(String[] args) から動き始めます。printlnは表示のあと改行します。命令の末尾にはセミコロンが必要です。',example:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("こんにちは、Java！");\n    }\n}',task:'「こんにちは、Java！」と表示させよう。',goal:'表示結果: こんにちは、Java！',hint:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("こんにちは、Java！");\n    }\n}',takeaway:'Javaの基本形は <code>class Main</code> と <code>main</code> メソッド。命令の末尾に <code>;</code> を付ける。',starter:'public class Main {\n    public static void main(String[] args) {\n        // この下に書いてみよう\n\n    }\n}\n',expected:'こんにちは、Java！'},
 {name:'複数行を表示',tag:'命令を重ねる',title:'2行のメッセージを出そう。',intro:'命令を上から順に並べると、その順番で実行されます。表示命令をもうひとつ足してみよう。',concept:'<code>println</code> は表示したあと改行します。呼び出すたびに次の行へ進みます。',detail:'System.out は標準出力を表し、printlnはそこへ1行書き出すメソッドです。メソッド呼び出しは名前のあとに丸かっこを付けます。かっこの中が表示する値です。',example:'System.out.println("1行目");\nSystem.out.println("2行目");',task:'「Javaを勉強中！」の次の行に「少しずつ覚えよう！」を表示しよう。',goal:'メッセージが2行に分かれて表示される',hint:'System.out.println("Javaを勉強中！");\nSystem.out.println("少しずつ覚えよう！");',takeaway:'命令は上から順に動く。<code>println</code> は毎回行を変える。',starter:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Javaを勉強中！");\n        // 次の表示を追加しよう\n    }\n}\n',expected:'Javaを勉強中！\n少しずつ覚えよう！'},
 {name:'文字列の変数',tag:'変数',title:'値に名前をつけよう。',intro:'文字列を変数に入れておくと、何度でも使えます。',concept:'<code>String</code> は文字列の型です。型、変数名、値の順に書いて変数を宣言します。',detail:'Javaでは変数を作るときに型を宣言します。String name = "Java"; は、nameという名前の変数に文字列を入れる文です。文字列をつなげるときは + を使います。Rustの{}埋め込みとは書き方が異なります。',example:'String name = "Java";\nSystem.out.println("こんにちは、" + name + "！");',task:'<code>language</code> に「Java」を入れ、挨拶に使おう。',goal:'出力: こんにちは、Java！',hint:'String language = "Java";\nSystem.out.println("こんにちは、" + language + "！");',takeaway:'Javaの変数宣言は <code>型 名前 = 値;</code>。Stringは大文字で始まる型名。',starter:'public class Main {\n    public static void main(String[] args) {\n        String language = "Java";\n        // languageを使って挨拶しよう\n\n    }\n}\n',expected:'こんにちは、Java！'},
 {name:'文字列をつなぐ',tag:'文字列の連結',title:'文字列を組み合わせよう。',intro:'+ を使うと、文字列や変数をつないで新しい文章を作れます。',concept:'文字列どうしの <code>+</code> は連結です。文字列と数字をつなぐと、数字も文字として表示されます。',detail:'Javaの+は数値同士なら足し算、どちらかがStringなら文字列連結になります。文字列を「+」でつなぐと、表示前に文章を組み立てられます。空白も必要なら文字列に含めます。',example:'String first = "Hello";\nString second = "Java";\nSystem.out.println(first + " " + second);',task:'<code>first</code> と <code>last</code> をつないで「Ada Lovelace」と表示しよう。',goal:'出力: Ada Lovelace',hint:'String first = "Ada";\nString last = "Lovelace";\nSystem.out.println(first + " " + last);',takeaway:'Javaでは <code>+</code> で文字列を連結できる。空白は自分で足す。',starter:'public class Main {\n    public static void main(String[] args) {\n        String first = "Ada";\n        String last = "Lovelace";\n        // 2つの文字列をつなごう\n\n    }\n}\n',expected:'Ada Lovelace'},
 {name:'整数と計算',tag:'int型',title:'数字を計算してみよう。',intro:'整数はint型で扱います。計算結果を変数に保存できます。',concept:'<code>int</code> は整数の型です。<code>+</code>、<code>-</code>、<code>*</code>、<code>/</code> で計算できます。',detail:'Javaは静的型付けの言語なので、整数にはint、文字列にはStringのように型を指定します。intどうしの割り算は小数部分を切り捨てます。計算結果も同じ型の変数へ代入できます。',example:'int start = 3;\nint days = start + 2;\nSystem.out.println(days);',task:'3に2を足した値を <code>days</code> に入れ、「5日目です！」と表示しよう。',goal:'出力: 5日目です！',hint:'int start = 3;\nint days = start + 2;\nSystem.out.println(days + "日目です！");',takeaway:'intは整数。文字列とつなげると表示用の文章を作れる。',starter:'public class Main {\n    public static void main(String[] args) {\n        int start = 3;\n        // 2を足してdaysに入れよう\n\n    }\n}\n',expected:'5日目です！'},
 {name:'値を更新する',tag:'再代入',title:'変数の値を書き換えよう。',intro:'Javaの変数は、同じ型の値をあとから代入して更新できます。',concept:'変数を作るときは型を書きます。2回目以降の代入では型を書かず、変数名に値を代入します。',detail:'Javaの通常のローカル変数は再代入できます。最初に int score = 10; と宣言し、その後 score = 15; と書きます。再代入にintを付けると、同じ名前をもう一度宣言することになりエラーです。',example:'int score = 10;\nscore = 15;\nSystem.out.println("スコアは" + score);',task:'<code>score</code> を10で作り、あとから15に更新して表示しよう。',goal:'出力: スコアは15',hint:'int score = 10;\nscore = 15;\nSystem.out.println("スコアは" + score);',takeaway:'変数の更新は <code>名前 = 新しい値;</code>。型は最初の宣言時に書く。',starter:'public class Main {\n    public static void main(String[] args) {\n        int score = 10;\n        // scoreを15に更新しよう\n\n        System.out.println("スコアは" + score);\n    }\n}\n',expected:'スコアは15'},
 {name:'コメント',tag:'コードにメモ',title:'コードに説明を残そう。',intro:'あとで読み返す自分や他の人のために、コードへメモを残せます。',concept:'<code>//</code> から行末まではコメントです。コメントは実行されません。',detail:'コメントはプログラムの説明や注意を残す場所です。Javaでは // で1行コメント、/* と */ で複数行コメントを書けます。コードが何をするかだけでなく、なぜそうするかを書くと役立ちます。',example:'// この行は実行されない\nSystem.out.println("この行は実行される");',task:'コメントを1行書き、その下で「コメントは表示されない」と表示しよう。',goal:'出力: コメントは表示されない',hint:'// これはコメント\nSystem.out.println("コメントは表示されない");',takeaway:'<code>//</code> は1行コメント。実行結果には現れない。',starter:'public class Main {\n    public static void main(String[] args) {\n        // ここにコメントを書こう\n        System.out.println("コメントは表示されない");\n    }\n}\n',expected:'コメントは表示されない'},
 {name:'真偽値',tag:'boolean型',title:'trueとfalseを使おう。',intro:'条件が正しいかどうかを表す真偽値を使ってみよう。',concept:'Javaの真偽値の型は <code>boolean</code> です。値は <code>true</code> か <code>false</code> です。',detail:'booleanはtrueまたはfalseのどちらかだけを取る型です。文字列ではないので引用符で囲みません。比較の結果もbooleanになり、if文の条件として使えます。',example:'boolean isLearning = true;\nSystem.out.println("勉強中: " + isLearning);',task:'<code>isLearning</code> にtrueを入れて「勉強中: true」と表示しよう。',goal:'出力: 勉強中: true',hint:'boolean isLearning = true;\nSystem.out.println("勉強中: " + isLearning);',takeaway:'booleanはtrue/falseを表す型。比較結果を入れることもできる。',starter:'public class Main {\n    public static void main(String[] args) {\n        boolean isLearning = true;\n        // 変数を表示しよう\n\n    }\n}\n',expected:'勉強中: true'},
 {name:'ifで分ける',tag:'条件分岐',title:'条件に応じて表示を変えよう。',intro:'ifとelseを使うと、条件が合うかどうかで処理を選べます。',concept:'<code>if (条件) { ... } else { ... }</code> と書きます。Javaでは条件を丸かっこで囲みます。',detail:'ifの条件にはbooleanになる式を書きます。score >= 10 は「scoreが10以上」という比較で、結果はtrueかfalseです。条件がtrueならif側、falseならelse側のブロックだけが動きます。',example:'if (score >= 10) {\n    System.out.println("合格！");\n} else {\n    System.out.println("もう一度！");\n}',task:'scoreが10以上なら「合格！」、そうでなければ「もう一度！」と表示しよう。scoreは12です。',goal:'出力: 合格！',hint:'int score = 12;\nif (score >= 10) {\n    System.out.println("合格！");\n} else {\n    System.out.println("もう一度！");\n}',takeaway:'if条件は丸かっこで囲む。条件に応じてどちらか一方のブロックが動く。',starter:'public class Main {\n    public static void main(String[] args) {\n        int score = 12;\n        // ifとelseで表示を分けよう\n\n    }\n}\n',expected:'合格！'},
 {name:'else if',tag:'複数の条件',title:'条件を段階的に調べよう。',intro:'条件が複数あるときはelse ifで順番に確認できます。',concept:'<code>else if (条件)</code> を続けて書くと、前の条件がfalseのときに次を調べます。',detail:'条件は上から評価され、最初にtrueになったブロックだけが実行されます。大きい点数の条件を先に書くと、意図した段階判定になります。どの条件もfalseの場合はelseが動きます。',example:'if (score >= 80) {\n    System.out.println("すごい！");\n} else if (score >= 50) {\n    System.out.println("いいね！");\n} else {\n    System.out.println("もう少し！");\n}',task:'80以上なら「すごい！」、50以上なら「いいね！」、それ以外は「もう少し！」。scoreは65です。',goal:'出力: いいね！',hint:'int score = 65;\nif (score >= 80) {\n    System.out.println("すごい！");\n} else if (score >= 50) {\n    System.out.println("いいね！");\n} else {\n    System.out.println("もう少し！");\n}',takeaway:'条件は上から順に確認される。境界の大きい条件から並べよう。',starter:'public class Main {\n    public static void main(String[] args) {\n        int score = 65;\n        // ifとelse ifで判定しよう\n\n    }\n}\n',expected:'いいね！'},
 {name:'メソッドを作る',tag:'メソッド',title:'処理に名前をつけよう。',intro:'何度も使う処理はメソッドにまとめて呼び出せます。',concept:'Javaではクラスの中の関数をメソッドと呼びます。<code>static void</code> は値を返さないメソッドの宣言です。',detail:'メソッドを定義しただけでは中の処理は動きません。mainからsayHello();と呼び出します。staticはインスタンスを作らずクラスから呼べる指定、voidは戻り値がないという意味です。',example:'static void sayHello() {\n    System.out.println("こんにちは！");\n}',task:'<code>sayHello</code> メソッドを作って呼び出し、「こんにちは！」と表示しよう。',goal:'出力: こんにちは！',hint:'public class Main {\n    static void sayHello() {\n        System.out.println("こんにちは！");\n    }\n    public static void main(String[] args) {\n        sayHello();\n    }\n}',takeaway:'メソッドはクラスの中に定義し、名前と丸かっこで呼び出す。',starter:'public class Main {\n    // sayHelloメソッドをここに作ろう\n\n    public static void main(String[] args) {\n        // メソッドを呼び出そう\n    }\n}\n',expected:'こんにちは！'},
 {name:'引数を渡す',tag:'メソッドの引数',title:'メソッドに情報を渡そう。',intro:'メソッドへ値を渡すと、受け取った情報を使って処理できます。',concept:'引数は <code>型 名前</code> の順に宣言します。呼び出し時に丸かっこの中へ値を渡します。',detail:'メソッドの引数は、メソッドが使う入力です。greet(String name) のStringが型、nameが引数名です。呼び出し側から渡した値がnameに入ります。Javaは呼び出し側の値と引数の型が合うか確認します。',example:'static void greet(String name) {\n    System.out.println("こんにちは、" + name + "！");\n}',task:'<code>greet</code> メソッドに「Java」を渡して挨拶しよう。',goal:'出力: こんにちは、Java！',hint:'static void greet(String name) {\n    System.out.println("こんにちは、" + name + "！");\n}\n// mainから greet("Java") を呼び出す',takeaway:'引数でメソッドへ値を渡せる。引数にも型宣言が必要。',starter:'public class Main {\n    // greetメソッドを作ろう\n\n    public static void main(String[] args) {\n        // "Java"を渡して呼び出そう\n    }\n}\n',expected:'こんにちは、Java！'},
 {name:'戻り値',tag:'値を返す',title:'メソッドから計算結果を返そう。',intro:'メソッドは画面表示だけでなく、計算した値を返すこともできます。',concept:'戻り値の型を <code>void</code> の代わりに書き、<code>return</code> で値を返します。',detail:'doubleNumberのようなメソッドがintを返すなら、宣言はstatic intになります。returnは呼び出し元へ値を返し、メソッドを終了します。返す値の型は宣言した型と一致させます。',example:'static int doubleNumber(int number) {\n    return number * 2;\n}',task:'数を2倍にするメソッドを作り、6を渡して「2倍すると12」と表示しよう。',goal:'出力: 2倍すると12',hint:'static int doubleNumber(int number) {\n    return number * 2;\n}\n// int answer = doubleNumber(6);\n// System.out.println("2倍すると" + answer);',takeaway:'戻り値の型を宣言し、<code>return</code> で値を返す。',starter:'public class Main {\n    // intを返すdoubleNumberメソッドを作ろう\n\n    public static void main(String[] args) {\n        int answer = doubleNumber(6);\n        System.out.println("2倍すると" + answer);\n    }\n}\n',expected:'2倍すると12'},
 {name:'whileループ',tag:'条件で繰り返す',title:'条件が合う間、繰り返そう。',intro:'whileは条件がtrueの間、同じ処理を繰り返します。',concept:'<code>while (条件) { ... }</code> は、ループの前に条件を確認します。',detail:'whileは条件がtrueの間だけ本体を実行します。countを毎回1ずつ減らすことで、やがてcount > 0がfalseになって終了します。値を変え忘れると無限ループになるので、更新処理を忘れないようにします。',example:'int count = 3;\nwhile (count > 0) {\n    System.out.println(count);\n    count--;\n}',task:'3から1までを順に表示するカウントダウンを作ろう。',goal:'3、2、1をそれぞれ別の行に表示',hint:'int count = 3;\nwhile (count > 0) {\n    System.out.println(count);\n    count--;\n}',takeaway:'whileは条件がtrueの間続く。ループ内で条件が変わるように更新する。',starter:'public class Main {\n    public static void main(String[] args) {\n        int count = 3;\n        while (count > 0) {\n            // countを表示して1減らそう\n        }\n    }\n}\n',expected:'3\n2\n1'},
 {name:'forループ',tag:'回数で繰り返す',title:'回数を決めて繰り返そう。',intro:'決まった回数の繰り返しにはforが便利です。',concept:'<code>for (初期化; 条件; 更新)</code> の順に3つの部分を書きます。',detail:'for文は、最初に一度だけ行う初期化、毎回調べる条件、各回のあとに行う更新をまとめて書きます。i++はiを1増やす短い書き方です。条件がfalseになると終了します。',example:'for (int i = 1; i <= 3; i++) {\n    System.out.println(i);\n}',task:'forを使って1から3までを、それぞれ1行ずつ表示しよう。',goal:'1、2、3をそれぞれ別の行に表示',hint:'for (int i = 1; i <= 3; i++) {\n    System.out.println(i);\n}',takeaway:'forの3部分は「初期化; 継続条件; 各回の更新」。',starter:'public class Main {\n    public static void main(String[] args) {\n        // 1から3までforで繰り返そう\n\n    }\n}\n',expected:'1\n2\n3'},
 {name:'配列',tag:'データをまとめる',title:'複数の値をまとめよう。',intro:'配列を使うと、同じ型の値をひとつの変数にまとめられます。',concept:'配列は <code>int[] scores</code> のように宣言します。添字は0から始まります。',detail:'配列は作成時に要素数が決まり、同じ型の値を並べて保持します。scores[0]が最初、scores[1]が2番目です。添字が範囲外だと実行時エラーになります。',example:'int[] scores = {80, 90, 100};\nSystem.out.println(scores[1]);',task:'80、90、100の配列を作り、2番目の点数を表示しよう。',goal:'出力: 2番目: 90',hint:'int[] scores = {80, 90, 100};\nSystem.out.println("2番目: " + scores[1]);',takeaway:'配列は同じ型の値をまとめる固定長の入れ物。添字は0から数える。',starter:'public class Main {\n    public static void main(String[] args) {\n        int[] scores = {80, 90, 100};\n        // 2番目の点数を表示しよう\n\n    }\n}\n',expected:'2番目: 90'},
 {name:'拡張for文',tag:'配列を順に読む',title:'配列の中身を順番に使おう。',intro:'配列やリストの全要素を順に処理するには拡張for文が使えます。',concept:'<code>for (型 要素 : 配列)</code> の形で、各要素を順番に受け取ります。',detail:'拡張for文は配列の添字を自分で管理しなくてよい書き方です。コロンの右側の配列から、左側の変数へ要素が一つずつ入ります。要素の順番に処理できます。',example:'String[] fruits = {"りんご", "みかん", "ぶどう"};\nfor (String fruit : fruits) {\n    System.out.println(fruit);\n}',task:'果物の配列を拡張for文で回して、3つの名前を1行ずつ表示しよう。',goal:'りんご、みかん、ぶどうをそれぞれ表示',hint:'String[] fruits = {"りんご", "みかん", "ぶどう"};\nfor (String fruit : fruits) {\n    System.out.println(fruit);\n}',takeaway:'拡張for文なら添字を書かずに、配列の要素を順番に処理できる。',starter:'public class Main {\n    public static void main(String[] args) {\n        String[] fruits = {"りんご", "みかん", "ぶどう"};\n        // 拡張for文で全部表示しよう\n\n    }\n}\n',expected:'りんご\nみかん\nぶどう'},
 {name:'ArrayList',tag:'増やせるリスト',title:'あとから要素を追加しよう。',intro:'ArrayListは、要素数を後から増やせるリストです。',concept:'<code>ArrayList&lt;String&gt;</code> を使います。追加には <code>add</code>、個数には <code>size</code> を使います。',detail:'配列は長さが固定ですが、ArrayListは必要に応じて要素を追加できます。利用にはjava.util.ArrayListのimportが必要です。ジェネリクスの<String>は、このリストにStringを入れるという指定です。',example:'import java.util.ArrayList;\nArrayList<String> names = new ArrayList<>();\nnames.add("Ada");\nSystem.out.println(names.size());',task:'名前を2つ入れたArrayListにもう1つ追加し、合計数を表示しよう。',goal:'出力: 3人',hint:'import java.util.ArrayList;\nArrayList<String> names = new ArrayList<>();\nnames.add("Ada");\nnames.add("Grace");\nnames.add("Linus");\nSystem.out.println(names.size() + "人");',takeaway:'ArrayListは可変長のリスト。<code>add</code>で追加、<code>size</code>で要素数を調べる。',starter:'import java.util.ArrayList;\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<String> names = new ArrayList<>();\n        names.add("Ada");\n        names.add("Grace");\n        // もう1人追加して、合計を表示しよう\n\n    }\n}\n',expected:'3人'},
 {name:'クラスとオブジェクト',tag:'自分の型を作る',title:'データと処理をまとめよう。',intro:'クラスを作ると、自分のプログラムに合わせた型を定義できます。',concept:'クラスにはデータを表すフィールドと、処理を表すメソッドを書けます。newでオブジェクトを作ります。',detail:'クラスはオブジェクトの設計図です。フィールドにオブジェクトの情報を持たせ、メソッドに振る舞いを書きます。newで作った実体をオブジェクトと呼び、ドットでフィールドやメソッドを使います。',example:'class Dog {\n    String name;\n    void bark() { System.out.println(name + "がワン！"); }\n}',task:'Dogクラスに名前を持たせ、barkメソッドで「ポチがワン！」と表示しよう。',goal:'出力: ポチがワン！',hint:'class Dog {\n    String name;\n    void bark() { System.out.println(name + "がワン！"); }\n}\n// mainでDog dog = new Dog(); dog.name = "ポチ"; dog.bark();',takeaway:'クラスは設計図、オブジェクトはその設計図から作った実体。',starter:'class Dog {\n    String name;\n    void bark() {\n        System.out.println(name + "がワン！");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Dog dog = new Dog();\n        dog.name = "ポチ";\n        // barkメソッドを呼び出そう\n    }\n}\n',expected:'ポチがワン！'},
 {name:'コンストラクタ',tag:'オブジェクトの準備',title:'作るときに値を渡そう。',intro:'コンストラクタを使うと、オブジェクトを作るときに初期値を設定できます。',concept:'コンストラクタはクラスと同じ名前で定義し、戻り値の型は書きません。<code>new</code> のときに呼び出されます。',detail:'コンストラクタはオブジェクト生成時に一度だけ呼ばれます。Dog(String name)の引数で受け取った値をthis.nameへ保存します。thisは今作っているオブジェクト自身を指します。これで初期化漏れを防げます。',example:'class Dog {\n    String name;\n    Dog(String name) { this.name = name; }\n}',task:'Dogのコンストラクタで名前を受け取り、作った犬に「ポチがワン！」と表示させよう。',goal:'出力: ポチがワン！',hint:'class Dog {\n    String name;\n    Dog(String name) { this.name = name; }\n    void bark() { System.out.println(name + "がワン！"); }\n}\n// Dog dog = new Dog("ポチ"); dog.bark();',takeaway:'コンストラクタはオブジェクトの初期状態を作る。<code>this.name</code>はフィールドを指す。',starter:'class Dog {\n    String name;\n    Dog(String name) {\n        this.name = name;\n    }\n    void bark() {\n        System.out.println(name + "がワン！");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Dog dog = new Dog("ポチ");\n        // barkを呼び出そう\n    }\n}\n',expected:'ポチがワン！'}
];
const $=id=>document.getElementById(id),key='java-small-class-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let current=Math.min(Math.max(Number(saved.current)||0,0),lessons.length-1),done=new Set(saved.done||[]),running=false;const prefix=new Set();for(let i=0;i<lessons.length&&done.has(i);i++)prefix.add(i);done=prefix;const firstOpen=lessons.findIndex((_,i)=>!done.has(i));if(firstOpen>=0&&current>firstOpen)current=firstOpen;
function persist(){try{localStorage.setItem(key,JSON.stringify({current,done:[...done]}))}catch{}}
function unlocked(i){for(let n=0;n<i;n++)if(!done.has(n))return false;return true}
function renderNav(){const last=current===lessons.length-1,complete=done.has(current);$('prevBtn').disabled=current===0;if(last){$('nextBtn').textContent=complete?'最初から復習する':'課題をクリアして修了';$('nextBtn').disabled=!complete}else{$('nextBtn').textContent=complete?'次のレッスンへ →':'課題をクリアすると次へ →';$('nextBtn').disabled=!complete}}
function renderList(){const list=$('lessonList');list.replaceChildren();lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson-link'+(current===i?' active':'')+(done.has(i)?' done':'');b.disabled=!unlocked(i);b.innerHTML=`<span class="step-no">${done.has(i)?'✓':String(i+1).padStart(2,'0')}</span><span class="lesson-name">${l.name}</span>`;b.title=b.disabled?`前のレッスンをクリアすると解放 · ${l.name}`:`${String(i+1).padStart(2,'0')} · ${l.name}`;b.onclick=()=>selectLesson(i);list.append(b)})}
function updateProgress(){const n=done.size,p=Math.round(100*n/lessons.length);$('topProgress').textContent=`${n} / ${lessons.length} 完了`;$('sideCount').textContent=`${n} / ${lessons.length}`;$('progressFill').style.width=p+'%';renderNav()}
function selectLesson(i){if(!unlocked(i))return;current=i;persist();renderLesson()}
function renderLesson(){const l=lessons[current];$('eyebrow').textContent=`LESSON ${String(current+1).padStart(2,'0')} · ${l.tag}`;$('headline').textContent=l.title;$('intro').textContent=l.intro;$('concept').innerHTML=l.concept;$('detailText').textContent=l.detail;$('detailExample').textContent=l.example;document.querySelector('.explain-more').open=false;$('taskText').innerHTML=l.task;$('goalText').innerHTML=l.goal;$('takeaway').innerHTML=l.takeaway;$('hintText').textContent=l.hint;$('hintText').classList.remove('show');$('hintBtn').textContent='ヒントを見る　＋';$('code').value=saved['code'+current]??l.starter;updateGutter();renderNav();renderList();updateProgress();resetOutput()}
function updateGutter(){const n=$('code').value.split('\n').length;$('gutter').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
function resetOutput(){$('output').className='console-body placeholder';$('output').textContent='ここにプログラムの出力やエラーが表示されます。';$('stateText').textContent='まだ実行していません';$('stateDot').style.background='#62687b'}
function showHint(note=''){const h=$('hintText');h.textContent=lessons[current].hint+(note?'\n\n'+note:'');h.classList.add('show');$('hintBtn').textContent='ヒントを隠す　−'}
function mismatchNote(output){const expected=lessons[current].expected,normalize=s=>s.replace(/!/g,'！');if(output!==expected&&normalize(output)===normalize(expected)){if(output.includes('!')&&expected.includes('！'))return '出力の半角「!」とお題の全角「！」が違うみたい。コードの ! を ！ に置き換えてみよう。';if(output.includes('！')&&expected.includes('!'))return '出力の全角「！」とお題の半角「!」が違うみたい。コードの ！ を ! に置き換えてみよう。'}return ''}
const praises=['いいね！一つずつJavaの書き方が身についてるよ。','ナイス！自分で書いたコードが動いたね。','その調子！できることがまた増えたよ。','やったね！落ち着いて書けていたよ。'];
function celebrate(){const last=current===lessons.length-1;$('cheerTitle').textContent=last?'全レッスンクリア！':`レッスン${String(current+1).padStart(2,'0')} クリア！`;$('cheerMessage').textContent=last?'20レッスン制覇！ここまでよくがんばったね。':`${praises[current%praises.length]} 次は「${lessons[current+1].name}」に挑戦しよう！`;$('cheerNext').textContent=last?'最初から復習する':'次のレッスンへ';$('cheerOverlay').hidden=false;document.body.classList.add('cheer-open');$('cheerNext').focus()}
function closeCheer(){ $('cheerOverlay').hidden=true;document.body.classList.remove('cheer-open');$('runBtn').focus()}
function continueCheer(){closeCheer();selectLesson(current===lessons.length-1?0:current+1)}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
async function run(){if(running)return;running=true;const btn=$('runBtn');btn.disabled=true;btn.innerHTML='<span>◌</span> 実行中…';$('stateText').textContent='このPCでJavaをコンパイル中';$('stateDot').style.background='#c4b5fd';$('output').className='console-body placeholder';$('output').textContent='javacでコンパイルして実行しています…';try{const response=await fetch('/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||`実行に失敗しました (${response.status})`);if(!result.success){$('output').className='console-body error';$('output').textContent=result.stderr||result.error||'コンパイルエラー';$('stateText').textContent='コンパイルエラー · ヒントを表示';$('stateDot').style.background='#ff8795';showHint();return}const out=(result.stdout||'').replace(/\n$/,'');$('output').className='console-body'+(out===lessons[current].expected?' success':'');$('output').textContent=(out||'(出力なし)')+(result.stderr?'\n\n[コンパイルログ]\n'+result.stderr.trim():'');if(out===lessons[current].expected){$('stateText').textContent='実行できました · お題クリア！';$('stateDot').style.background='#a6f1ce';done.add(current);persist();renderList();updateProgress();celebrate()}else{$('stateText').textContent='結果が違うようです · ヒントを表示';$('stateDot').style.background='#c4b5fd';showHint(mismatchNote(out));toast('おしい！結果を見てヒントを確認しよう')}}catch(e){$('output').className='console-body error';$('output').textContent='実行できませんでした。Javaのインストールとサーバーを確認してください。\n'+e.message;$('stateText').textContent='実行に失敗';$('stateDot').style.background='#ff8795'}finally{running=false;btn.disabled=false;btn.innerHTML='<span>▶</span> 実行して確認'}}
$('code').addEventListener('input',()=>{updateGutter();saved['code'+current]=$('code').value;persist()});$('code').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();run()}if(e.key==='Tab'){e.preventDefault();const a=e.target,s=a.selectionStart,end=a.selectionEnd;a.value=a.value.slice(0,s)+'    '+a.value.slice(end);a.selectionStart=a.selectionEnd=s+4;a.dispatchEvent(new Event('input'))}});
$('runBtn').onclick=run;$('prevBtn').onclick=()=>selectLesson(Math.max(0,current-1));$('nextBtn').onclick=()=>selectLesson(current===lessons.length-1?0:current+1);$('resetCodeBtn').onclick=()=>{$('code').value=lessons[current].starter;$('code').dispatchEvent(new Event('input'));resetOutput()};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);toast('コードをコピーしました')}catch{toast('コピーできませんでした')}};$('hintBtn').onclick=()=>{const h=$('hintText'),open=!h.classList.contains('show');h.classList.toggle('show',open);$('hintBtn').textContent=open?'ヒントを隠す　−':'ヒントを見る　＋'};$('clearProgress').onclick=()=>{if(confirm('学習の記録と保存したコードを消しますか？')){localStorage.removeItem(key);saved={};done.clear();current=0;renderLesson();toast('記録をリセットしました')}};$('cheerNext').onclick=continueCheer;$('cheerClose').onclick=closeCheer;$('cheerOverlay').addEventListener('click',e=>{if(e.target===$('cheerOverlay'))closeCheer()});addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('cheerOverlay').hidden)closeCheer()});
renderLesson();
})();
</script></body></html>
